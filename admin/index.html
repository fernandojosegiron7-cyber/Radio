<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Administración • Aló Paisano Radio</title>
<link rel="stylesheet" href="./style.css">
</head>
<body>
<main class="shell">
  <section id="loginCard" class="login card">
    <div class="badge">ADMIN PRIVADO</div>
    <h1>Aló Paisano Radio</h1>
    <p>Ingresa tu contraseña para administrar la radio.</p>
    <input id="password" type="password" placeholder="Contraseña de administrador" autocomplete="current-password">
    <button id="loginBtn">Entrar</button>
    <div id="loginMsg" class="msg"></div>
  </section>

  <section id="panel" class="panel hidden">
    <header class="head">
      <div><div class="badge">FG MEDIA • RADIO CONTROL</div><h1>Panel de administración</h1><p>Los cambios se guardan para todos los visitantes.</p></div>
      <a href="/app/" target="_blank">Ver reproductor ↗</a>
    </header>

    <form id="form">
      <section class="card">
        <h2>Identidad</h2>
        <div class="grid">
          <label>Nombre<input name="stationName"></label>
          <label>Frase<input name="tagline"></label>
          <label class="full">URL del logo<input name="logoUrl"></label>
          <label class="full">O subir logo pequeño<input id="logoFile" type="file" accept="image/*"><small>Máx. 1.2 MB</small></label>
          <label class="full">URL de fondo<input name="backgroundUrl"></label>
          <label class="full">O subir fondo pequeño<input id="bgFile" type="file" accept="image/*"><small>Máx. 1.2 MB</small></label>
          <label>Color principal<input name="accent" type="color"></label>
          <label>Color secundario<input name="accent2" type="color"></label>
        </div>
      </section>

      <section class="card">
        <h2>Streaming</h2>
        <div class="grid">
          <label class="full">URL de transmisión<input name="streamUrl"></label>
          <label class="full">URL de metadatos<input name="metadataUrl"></label>
          <label class="check full"><input name="showHistory" type="checkbox"> Mostrar historial</label>
        </div>
      </section>

      <section class="card">
        <h2>Redes</h2>
        <div class="grid">
          <label>WhatsApp<input name="whatsapp"></label>
          <label>Facebook<input name="facebook"></label>
          <label>Instagram<input name="instagram"></label>
          <label>TikTok<input name="tiktok"></label>
          <label class="full">Sitio web<input name="website"></label>
        </div>
      </section>

      <div class="actions">
        <button type="button" id="logout" class="secondary">Salir</button>
        <button type="submit">Guardar cambios</button>
      </div>
      <div id="saveMsg" class="msg right"></div>
    </form>
  </section>
</main>
<script src="./admin.js"></script>
</body>
</html>
